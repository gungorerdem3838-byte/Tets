name: Otomatik Kur ve Derle (Fabric 1.21.11)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Tum Mod Dosyalarini Olustur
        run: |
          mkdir -p "src/main/java/com/buyumodu"
          mkdir -p "src/main/resources/data/buyumodu/recipe"
          mkdir -p "src/main/resources/data/buyumodu/loot_table/blocks"
          mkdir -p "src/main/resources/data/buyumodu/enchantment"
          mkdir -p "src/main/resources/data/minecraft/tags/block/mineable"
          mkdir -p "src/main/resources/assets/buyumodu/lang"
          mkdir -p "src/main/resources/assets/buyumodu/blockstates"
          mkdir -p "src/main/resources/assets/buyumodu/items"
          mkdir -p "src/main/resources/assets/buyumodu/models/item"
          mkdir -p "src/main/resources/assets/buyumodu/models/block"
          echo "cGx1Z2luTWFuYWdlbWVudCB7CiAgICByZXBvc2l0b3JpZXMgewogICAgICAgIG1hdmVuIHsKICAgICAgICAgICAgbmFtZSA9ICdGYWJyaWMnCiAgICAgICAgICAgIHVybCA9ICdodHRwczovL21hdmVuLmZhYnJpY21jLm5ldC8nCiAgICAgICAgfQogICAgICAgIG1hdmVuQ2VudHJhbCgpCiAgICAgICAgZ3JhZGxlUGx1Z2luUG9ydGFsKCkKICAgIH0KfQo=" | base64 -d > "settings.gradle"
          echo "" | base64 -d > "gradle.properties"
          echo "" | base64 -d > "build.gradle"
          echo "" | base64 -d > "src/main/java/com/buyumodu/BleedingEffect.java"
          echo "" | base64 -d > "src/main/java/com/buyumodu/PedestalBlock.java"
          echo "" | base64 -d > "src/main/java/com/buyumodu/BuyuModu.java"
          echo "" | base64 -d > "src/main/resources/fabric.mod.json"
          echo "" | base64 -d > "src/main/resources/data/buyumodu/enchantment/kanama.json"
          echo "ewogICJyZXBsYWNlIjogZmFsc2UsCiAgInZhbHVlcyI6IFsKICAgICJidXl1bW9kdTpleWVfcGVkZXN0YWwiLAogICAgImJ1eXVtb2R1OnBlYXJsX3BlZGVzdGFsIiwKICAgICJidXl1bW9kdTplbWVyYWxkX3BlZGVzdGFsIgogIF0KfQo=" | base64 -d > "src/main/resources/data/minecraft/tags/block/mineable/pickaxe.json"
          echo "" | base64 -d > "src/main/resources/assets/buyumodu/lang/tr_tr.json"
          echo "" | base64 -d > "src/main/resources/assets/buyumodu/lang/en_us.json"
          echo "" | base64 -d > "src/main/resources/data/buyumodu/recipe/eye_pedestal.json"
          echo "ewogICJ0eXBlIjogIm1pbmVjcmFmdDpibG9jayIsCiAgInBvb2xzIjogW3sKICAgICJyb2xscyI6IDEuMCwKICAgICJjb25kaXRpb25zIjogW3siY29uZGl0aW9uIjogIm1pbmVjcmFmdDpzdXJ2aXZlc19leHBsb3Npb24ifV0sCiAgICAiZW50cmllcyI6IFt7InR5cGUiOiAibWluZWNyYWZ0Oml0ZW0iLCAibmFtZSI6ICJidXl1bW9kdTpleWVfcGVkZXN0YWwifV0KICB9XQp9Cg==" | base64 -d > "src/main/resources/data/buyumodu/loot_table/blocks/eye_pedestal.json"
          echo "ewogICJ2YXJpYW50cyI6IHsgIiI6IHsgIm1vZGVsIjogImJ1eXVtb2R1OmJsb2NrL2V5ZV9wZWRlc3RhbCIgfSB9Cn0K" | base64 -d > "src/main/resources/assets/buyumodu/blockstates/eye_pedestal.json"
          echo "ewogICJtb2RlbCI6IHsgInR5cGUiOiAibWluZWNyYWZ0Om1vZGVsIiwgIm1vZGVsIjogImJ1eXVtb2R1OmJsb2NrL2V5ZV9wZWRlc3RhbCIgfQp9Cg==" | base64 -d > "src/main/resources/assets/buyumodu/items/eye_pedestal.json"
          echo "ewogICJwYXJlbnQiOiAiYnV5dW1vZHU6YmxvY2svZXllX3BlZGVzdGFsIgp9Cg==" | base64 -d > "src/main/resources/assets/buyumodu/models/item/eye_pedestal.json"
          echo "" | base64 -d > "src/main/resources/assets/buyumodu/models/block/eye_pedestal.json"
          echo "" | base64 -d > "src/main/resources/data/buyumodu/recipe/pearl_pedestal.json"
          echo "ewogICJ0eXBlIjogIm1pbmVjcmFmdDpibG9jayIsCiAgInBvb2xzIjogW3sKICAgICJyb2xscyI6IDEuMCwKICAgICJjb25kaXRpb25zIjogW3siY29uZGl0aW9uIjogIm1pbmVjcmFmdDpzdXJ2aXZlc19leHBsb3Npb24ifV0sCiAgICAiZW50cmllcyI6IFt7InR5cGUiOiAibWluZWNyYWZ0Oml0ZW0iLCAibmFtZSI6ICJidXl1bW9kdTpwZWFybF9wZWRlc3RhbCJ9XQogIH1dCn0K" | base64 -d > "src/main/resources/data/buyumodu/loot_table/blocks/pearl_pedestal.json"
          echo "ewogICJ2YXJpYW50cyI6IHsgIiI6IHsgIm1vZGVsIjogImJ1eXVtb2R1OmJsb2NrL3BlYXJsX3BlZGVzdGFsIiB9IH0KfQo=" | base64 -d > "src/main/resources/assets/buyumodu/blockstates/pearl_pedestal.json"
          echo "ewogICJtb2RlbCI6IHsgInR5cGUiOiAibWluZWNyYWZ0Om1vZGVsIiwgIm1vZGVsIjogImJ1eXVtb2R1OmJsb2NrL3BlYXJsX3BlZGVzdGFsIiB9Cn0K" | base64 -d > "src/main/resources/assets/buyumodu/items/pearl_pedestal.json"
          echo "ewogICJwYXJlbnQiOiAiYnV5dW1vZHU6YmxvY2svcGVhcmxfcGVkZXN0YWwiCn0K" | base64 -d > "src/main/resources/assets/buyumodu/models/item/pearl_pedestal.json"
          echo "" | base64 -d > "src/main/resources/assets/buyumodu/models/block/pearl_pedestal.json"
          echo "" | base64 -d > "src/main/resources/data/buyumodu/recipe/emerald_pedestal.json"
          echo "ewogICJ0eXBlIjogIm1pbmVjcmFmdDpibG9jayIsCiAgInBvb2xzIjogW3sKICAgICJyb2xscyI6IDEuMCwKICAgICJjb25kaXRpb25zIjogW3siY29uZGl0aW9uIjogIm1pbmVjcmFmdDpzdXJ2aXZlc19leHBsb3Npb24ifV0sCiAgICAiZW50cmllcyI6IFt7InR5cGUiOiAibWluZWNyYWZ0Oml0ZW0iLCAibmFtZSI6ICJidXl1bW9kdTplbWVyYWxkX3BlZGVzdGFsIn1dCiAgfV0KfQo=" | base64 -d > "src/main/resources/data/buyumodu/loot_table/blocks/emerald_pedestal.json"
          echo "ewogICJ2YXJpYW50cyI6IHsgIiI6IHsgIm1vZGVsIjogImJ1eXVtb2R1OmJsb2NrL2VtZXJhbGRfcGVkZXN0YWwiIH0gfQp9Cg==" | base64 -d > "src/main/resources/assets/buyumodu/blockstates/emerald_pedestal.json"
          echo "ewogICJtb2RlbCI6IHsgInR5cGUiOiAibWluZWNyYWZ0Om1vZGVsIiwgIm1vZGVsIjogImJ1eXVtb2R1OmJsb2NrL2VtZXJhbGRfcGVkZXN0YWwiIH0KfQo=" | base64 -d > "src/main/resources/assets/buyumodu/items/emerald_pedestal.json"
          echo "ewogICJwYXJlbnQiOiAiYnV5dW1vZHU6YmxvY2svZW1lcmFsZF9wZWRlc3RhbCIKfQo=" | base64 -d > "src/main/resources/assets/buyumodu/models/item/emerald_pedestal.json"
          echo "" | base64 -d > "src/main/resources/assets/buyumodu/models/block/emerald_pedestal.json"
          echo "ewogICJtb2RlbCI6IHsgInR5cGUiOiAibWluZWNyYWZ0Om1vZGVsIiwgIm1vZGVsIjogIm1pbmVjcmFmdDppdGVtL2VuY2hhbnRlZF9ib29rIiB9Cn0K" | base64 -d > "src/main/resources/assets/buyumodu/items/kanama_book.json"
          echo "ewogICJwYXJlbnQiOiAibWluZWNyYWZ0Oml0ZW0vZW5jaGFudGVkX2Jvb2siCn0K" | base64 -d > "src/main/resources/assets/buyumodu/models/item/kanama_book.json"

      - name: Dosyalari GitHub Deposuna Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "BuyuModu.java 1.21.11 derleme duzeltmesi"
          git push

      - name: Java 21 Kur
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 9.5.0 Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Modu Derle (Build)
        run: gradle build --no-daemon

      - name: Mod Jar Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: buyu-modu-1.21.11-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
