name: Otomatik Kur ve Derle (Fabric 1.21.11)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Fabric 1.21.11 Surumlerini Cek ve Dosyalari Olustur
        run: |
          # Fabric resmi sunucularindan en guncel Loom, Loader ve Fabric API surumlerini otomatik bul
          LOOM_VER=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -oPm1 "(?<=<release>)[^<]+")
          if [ -z "$LOOM_VER" ]; then LOOM_VER="1.11-SNAPSHOT"; fi

          LOADER_VER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0].version')
          if [ -z "$LOADER_VER" ] || [ "$LOADER_VER" = "null" ]; then LOADER_VER="0.16.10"; fi

          FAPI_VER=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep "<version>" | grep "+1.21.11<" | tail -n 1 | sed -e 's/.*<version>//' -e 's/<\/version>.*//' | tr -d '[:space:]')
          if [ -z "$FAPI_VER" ]; then
            FAPI_VER=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oPm1 "(?<=<release>)[^<]+")
          fi

          echo "Bulunan Surumler -> Loom: $LOOM_VER | Loader: $LOADER_VER | Fabric API: $FAPI_VER"

          mkdir -p "src/main/java/com/buyumodu"
          mkdir -p "src/main/resources/data/buyumodu/recipe"
          mkdir -p "src/main/resources/data/buyumodu/loot_table/blocks"
          mkdir -p "src/main/resources/data/minecraft/tags/block/mineable"
          mkdir -p "src/main/resources/assets/buyumodu/lang"
          mkdir -p "src/main/resources/assets/buyumodu/blockstates"
          mkdir -p "src/main/resources/assets/buyumodu/items"
          mkdir -p "src/main/resources/assets/buyumodu/models/item"
          mkdir -p "src/main/resources/assets/buyumodu/models/block"

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat << EOF > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          loader_version=${LOADER_VER}
          mod_version=1.0.0
          maven_group=com.buyumodu
          archives_base_name=buyumodu
          fabric_version=${FAPI_VER}
          EOF

          cat << EOF > build.gradle
          plugins {
              id 'fabric-loom' version '${LOOM_VER}'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:\${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:\${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:\${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/java/com/buyumodu/BuyuModu.java
          package com.buyumodu;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.itemgroup.v1.ItemGroupEvents;
          import net.minecraft.core.Registry;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import java.util.function.Function;

          public class BuyuModu implements ModInitializer {
              public static final String MOD_ID = "buyumodu";

              public static final Block EYE_PEDESTAL = registerBlock("eye_pedestal",
                      props -> new Block(props.strength(2.0f, 6.0f).requiresCorrectToolForDrops().noOcclusion()));

              public static final Block PEARL_PEDESTAL = registerBlock("pearl_pedestal",
                      props -> new Block(props.strength(2.0f, 6.0f).requiresCorrectToolForDrops().noOcclusion()));

              public static final Block EMERALD_PEDESTAL = registerBlock("emerald_pedestal",
                      props -> new Block(props.strength(2.0f, 6.0f).requiresCorrectToolForDrops().noOcclusion()));

              private static Block registerBlock(String name, Function<BlockBehaviour.Properties, Block> factory) {
                  Identifier id = Identifier.fromNamespaceAndPath(MOD_ID, name);
                  ResourceKey<Block> blockKey = ResourceKey.create(Registries.BLOCK, id);
                  BlockBehaviour.Properties props = BlockBehaviour.Properties.ofFullCopy(Blocks.BLACKSTONE).setId(blockKey);
                  Block block = Registry.register(BuiltInRegistries.BLOCK, blockKey, factory.apply(props));

                  ResourceKey<Item> itemKey = ResourceKey.create(Registries.ITEM, id);
                  Item.Properties itemProps = new Item.Properties().useBlockDescriptionPrefix().setId(itemKey);
                  Registry.register(BuiltInRegistries.ITEM, itemKey, new BlockItem(block, itemProps));

                  return block;
              }

              @Override
              public void onInitialize() {
                  ItemGroupEvents.modifyEntriesEvent(CreativeModeTabs.FUNCTIONAL_BLOCKS).register(entries -> {
                      entries.accept(EYE_PEDESTAL);
                      entries.accept(PEARL_PEDESTAL);
                      entries.accept(EMERALD_PEDESTAL);
                  });
              }
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "buyumodu",
            "version": "${version}",
            "name": "Büyü Modu",
            "description": "GUI içermeyen ritüel büyü sistemi.",
            "authors": ["Erdem"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": [
                "com.buyumodu.BuyuModu"
              ]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/data/buyumodu/recipe/eye_pedestal.json
          {
            "type": "minecraft:crafting_shaped",
            "category": "misc",
            "pattern": ["S", "M", "W"],
            "key": {
              "S": "minecraft:blackstone_slab",
              "M": "minecraft:ender_eye",
              "W": "minecraft:blackstone_wall"
            },
            "result": { "id": "buyumodu:eye_pedestal", "count": 1 }
          }
          EOF

          cat << 'EOF' > src/main/resources/data/buyumodu/recipe/pearl_pedestal.json
          {
            "type": "minecraft:crafting_shaped",
            "category": "misc",
            "pattern": ["S", "M", "W"],
            "key": {
              "S": "minecraft:blackstone_slab",
              "M": "minecraft:ender_pearl",
              "W": "minecraft:blackstone_wall"
            },
            "result": { "id": "buyumodu:pearl_pedestal", "count": 1 }
          }
          EOF

          cat << 'EOF' > src/main/resources/data/buyumodu/recipe/emerald_pedestal.json
          {
            "type": "minecraft:crafting_shaped",
            "category": "misc",
            "pattern": ["S", "M", "W"],
            "key": {
              "S": "minecraft:blackstone_slab",
              "M": "minecraft:emerald_block",
              "W": "minecraft:blackstone_wall"
            },
            "result": { "id": "buyumodu:emerald_pedestal", "count": 1 }
          }
          EOF

          cat << 'EOF' > src/main/resources/data/minecraft/tags/block/mineable/pickaxe.json
          {
            "replace": false,
            "values": [
              "buyumodu:eye_pedestal",
              "buyumodu:pearl_pedestal",
              "buyumodu:emerald_pedestal"
            ]
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/buyumodu/lang/tr_tr.json
          {
            "block.buyumodu.eye_pedestal": "Göz Sütunu",
            "block.buyumodu.pearl_pedestal": "İnci Sütunu",
            "block.buyumodu.emerald_pedestal": "Zümrüt Sütunu"
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/buyumodu/lang/en_us.json
          {
            "block.buyumodu.eye_pedestal": "Eye Pedestal",
            "block.buyumodu.pearl_pedestal": "Pearl Pedestal",
            "block.buyumodu.emerald_pedestal": "Emerald Pedestal"
          }
          EOF

          for id in eye_pedestal pearl_pedestal emerald_pedestal; do
            if [ "$id" = "eye_pedestal" ]; then tex="minecraft:item/ender_eye"; fi
            if [ "$id" = "pearl_pedestal" ]; then tex="minecraft:item/ender_pearl"; fi
            if [ "$id" = "emerald_pedestal" ]; then tex="minecraft:block/emerald_block"; fi

            cat << EOF > src/main/resources/data/buyumodu/loot_table/blocks/${id}.json
          {
            "type": "minecraft:block",
            "pools": [{
              "rolls": 1.0,
              "conditions": [{"condition": "minecraft:survives_explosion"}],
              "entries": [{"type": "minecraft:item", "name": "buyumodu:${id}"}]
            }]
          }
          EOF

            cat << EOF > src/main/resources/assets/buyumodu/blockstates/${id}.json
          {
            "variants": { "": { "model": "buyumodu:block/${id}" } }
          }
          EOF

            cat << EOF > src/main/resources/assets/buyumodu/items/${id}.json
          {
            "model": { "type": "minecraft:model", "model": "buyumodu:block/${id}" }
          }
          EOF

            cat << EOF > src/main/resources/assets/buyumodu/models/item/${id}.json
          {
            "parent": "buyumodu:block/${id}"
          }
          EOF

            cat << EOF > src/main/resources/assets/buyumodu/models/block/${id}.json
          {
            "parent": "minecraft:block/block",
            "textures": {
              "particle": "minecraft:block/blackstone",
              "base": "minecraft:block/blackstone",
              "top": "minecraft:block/blackstone_top",
              "core": "${tex}"
            },
            "elements": [
              {
                "from": [4, 0, 4], "to": [12, 6, 12],
                "faces": {
                  "north": {"texture": "#base"}, "south": {"texture": "#base"},
                  "west": {"texture": "#base"}, "east": {"texture": "#base"},
                  "up": {"texture": "#top"}, "down": {"texture": "#top"}
                }
              },
              {
                "from": [5, 6, 5], "to": [11, 12, 11],
                "faces": {
                  "north": {"texture": "#core"}, "south": {"texture": "#core"},
                  "west": {"texture": "#core"}, "east": {"texture": "#core"}
                }
              },
              {
                "from": [2, 12, 2], "to": [14, 16, 14],
                "faces": {
                  "north": {"texture": "#base"}, "south": {"texture": "#base"},
                  "west": {"texture": "#base"}, "east": {"texture": "#base"},
                  "up": {"texture": "#top"}, "down": {"texture": "#top"}
                }
              }
            ]
          }
          EOF
          done

          sed -i 's/^          //' settings.gradle gradle.properties build.gradle src/main/java/com/buyumodu/BuyuModu.java src/main/resources/fabric.mod.json

      - name: Dosyalari GitHub Deposuna Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Mojang Mappings ve guncel Loom gecisi"
          git push

      - name: Java 21 Kur
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Modu Derle (Build)
        run: gradle build --no-daemon

      - name: Mod Jar Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: buyu-modu-1.21.11-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
