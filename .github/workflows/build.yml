      - name: Dosyalari GitHub Deposuna Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Rituelde zumrut yerine lapis kullanimi"
          git push

      - name: Java 21 Kur
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 9.5.0 Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Modu Derle (Build)
        run: gradle build --no-daemon

      - name: Mod Jar Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: buyu-modu-1.21.11-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
